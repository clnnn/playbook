contexts:
  - name: Inventory
    path: ./packages/inventory/docs/CONTEXT.yaml
    tag: supporting
    description: Tracks stock levels per warehouse and is the single source of truth for available quantity.

  - name: Shipping
    path: ./packages/shipping/docs/CONTEXT.yaml
    tag: supporting
    description: Dispatches parcels and tracks delivery status.

relationships:
  - upstream: Inventory
    downstream: Shipping
    label: ACL
    implication: Shipping translates Inventory's stock model into its own picking model; Shipping is insulated from Inventory changes and never writes back to Inventory.
