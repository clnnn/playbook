contexts:
  - name: Orders
    path: ./packages/orders/docs/CONTEXT.yaml
    tag: core
    description: Receives and tracks customer orders; the differentiator is real-time inventory-aware order promising.

  - name: Inventory
    path: ./packages/inventory/docs/CONTEXT.yaml
    tag: supporting
    description: Tracks stock levels per warehouse.

  - name: Customers
    path: ./packages/customers/docs/CONTEXT.yaml
    tag: supporting
    description: Stores customer profiles and contact details.

relationships:
  - upstream: Inventory
    downstream: Orders
    label: Customer-Supplier
    implication: Inventory owns the stock-availability contract; Orders adapts to it.

  - upstream: Customers
    downstream: Orders
    label: Customer-Supplier
    implication: Customers owns the CustomerId contract; Orders adapts to it.
