ap... so the rest of this discussion references something real.'"},{"text":"The response still moves toward the user's actual question (where fraud detection should go) after flagging the mismatch","passed":true,"evidence":"Gives a full placement recommendation for fraud detection (new Risk context)."}],"summary":{"passed":4,"failed":0,"total":4,"pass_rate":1},"timing":{"total_tokens":13737,"duration_ms":35324,"total_duration_seconds":35.3}}},{"name":"glossary-term-conflict","prompt":"I want to add orders to our supplier management — basically we need to send orders to suppliers to restock inventory.","wsResp":"Before we go further, I want to flag something, because the word \"order\" is about to mean two different things in your system and that will bite you later.\n\nI read your existing docs. Your `Orders` context defines an **Order** very specifically:\n\n> \"A customer's request to purchase one or more items at a point in time.\" — and it explicitly tells you to *avoid* \"Purchase\" and \"Transaction\".\n\nSo in your system today, an Order is something a **customer** sends **to you**, inbound. What you're describing now is the opposite direction: something **you** send **to a supplier**, outbound, to restock your own inventory. Same English word, opposite flow, different lifecycle, different owner. If we both call it \"Order,\" every future conversation, every event name, and every line of code will be ambiguous about which direction it's going.\n\nSo my first question is about naming, not architecture.\n\n**Q: What do you want to call the thing you send to a supplier to restock inventory — given that \"Order\" is already taken by the customer-facing concept?**\n\n**Recommendation:** Call it a **Purchase Order** (or just **Restock Order** if you prefer plainer language). Reserve \"Order\" exclusively for the customer-facing concept it already names in the Orders glossary. This keeps the two flows unambiguous in conversation and in code, and it matches the common industry split where \"sales order\" (inbound) and \"purchase order\" (outbound) are deliberately never both called just \"order.\"\n\nOnce we agree on the word, the next thing I'll want to pin down is *where this new concept lives* — whether it belongs inside your existing Suppliers context (which today only manages supplier records and contacts) or in a new context of its own — and then how it relates to inventory and to the Suppliers area. But naming first: if we get the word wrong, everything downstream inherits the ambiguity.\n\n---\n\nTechniques fired: Challenge against the glossary, Sharpen fuzzy language\n\nCaptured: nothing yet — holding all file changes until you confirm the term. The conflict is real (Orders glossary defines \"Order\" as customer-inbound; your new concept is supplier-outbound), so I don't want to write a second clashing definition into the docs until we settle on the name.\n","woResp":"Happy to help wire this up. Before I touch any code, I dug into your existing context docs, and there's an important naming/modeling issue worth flagging first because it'll shape how we build this.\n\n## The term \"Order\" already means something specific in your system\n\nYour `packages/orders` context defines **Order** very deliberately:\n\n> \"A customer's request to purchase one or more items at a point in time.\"\n\nIt even lists `Purchase`, `Transaction`, and `Basket` as terms to *avoid* — so the Orders team has clearly already done the work of pinning down what an Order is, and it's strictly customer-facing.\n\nWhat you're describing — \"send orders to suppliers to restock inventory\" — is a different concept that points the opposite direction (you → supplier, not customer → you). If we also call that an \"Order,\" we'll end up with two incompatible meanings of the same word living in the same codebase. That tends to cause real bugs (code/queries/events that conflate customer demand with restock supply) and endless \"which kind of order do you mean?\" conversations.\n\nThe industry-standard term for this is a **Purchase Order** (PO) — a request *you* issue to a supplier to buy stock. I'd suggest we model it as its own concept, most naturally living in (or alongside) the **Suppliers** context rather than reusing the customer-`Orders` context.\n\n## A few things I need to understand before designing this\n\n1. **Where should this live?** Your CONTEXT-MAP currently says Orders and Suppliers are \"Separate Ways\" — fully independent, no integration. Adding purchase orders changes that. My instinct is a Purchase Order belongs in the Suppliers context (it's about *procuring from a supplier*). Does that match how your team thinks about it, or do you see it as a new area entirely?\n\n2. **What triggers a restock order?** Is someone manually creating these, or is it driven by inventory thresholds? (I notice there's no Inventory context in the map yet — is inventory tracked somewhere, or is that a gap?)\n\n3. **What's the lifecycle?** For a supplier-facing order, do you need states like draft → sent → confirmed → received? And do you need to record what actually arrived vs. what was ordered (partial deliveries, etc.)?\n\n4. **\"Send\" how?** Email, an API to the supplier, a generated PDF, or just an internal record for now? This heavily affects scope.\n\n5. **Relationship to customer Orders / inventory promising.** Your Orders context's differentiator is \"real-time inventory-aware order promising.\" Restocking obviously feeds the inventory that promising depends on — should creating/receiving a purchase order update available inventory that customer order promising reads from? That's the integration that would replace today's \"Separate Ways.\"\n\n## My proposed direction (pending your answers)\n\n- Introduce a **Purchase Order** concept (avoid overloading \"Order\").\n- Model it in the **Suppliers** context as the thing that restocks inventory.\n- Update `docs/CONTEXT-MAP.yaml` to reflect a real relationship between Suppliers and whatever owns inventory, instead of \"Separate Ways.\"\n- Add the new term to `packages/suppliers/docs/CONTEXT.yaml` with a clear definition and an `avoid: [Order]` note so the boundary stays crisp.\n\nIf you'd rather just call it \"Order\" inside Suppliers and accept the overlap, we can — but I'd recommend against it. Let me know your answers to the questions above (especially #1, #2, and #5) and I'll lay out the concrete structure and start building.\n","wsG":{"expectations":[{"text":"The response shows evidence of reading the existing glossary where 'Order' is defined as a customer-facing concept","passed":true,"evidence":"Quotes Orders glossary: Order = 'a customer's request to purchase...' and the avoid list."},{"text":"The response flags the conflict between the user's supplier-facing 'order' and the existing customer-facing 'Order' term","passed":true,"evidence":"'Same English word, opposite flow' — flags inbound customer Order vs outbound supplier order."},{"text":"The response proposes a distinct term for the supplier-facing concept (e.g. Purchase Order, Restock Order, Supplier Order)","passed":true,"evidence":"Proposes 'Purchase Order (or Restock Order)' and reserves 'Order' for the customer concept."},{"text":"The opening question uses the Q/Recommendation format with a concrete recommendation","passed":true,"evidence":"'**Q:** What do you want to call the thing you send to a supplier...?' + Recommendation; emits the turn separator."}],"summary":{"passed":4,"failed":0,"total":4,"pass_rate":1},"timing":{"total_tokens":23114,"duration_ms":51947,"total_duration_seconds":51.9}},"woG":{"expectations":[{"text":"The response shows evidence of reading the existing glossary where 'Order' is defined as a customer-facing concept","passed":true,"evidence":"Quotes the Order definition and the avoid list including Basket."},{"text":"The response flags the conflict between the user's supplier-facing 'order' and the existing customer-facing 'Order' term","passed":true,"evidence":"'two incompatible meanings of the same word living in the same codebase.'"},{"text":"The response proposes a distinct term for the supplier-facing concept (e.g. Purchase Order, Restock Order, Supplier Order)","passed":true,"evidence":"'The industry-standard term... is a Purchase Order (PO).'"},{"text":"The opening question uses the Q/Recommendation format with a concrete recommendation","passed":false,"evidence":"No Q:/Recommendation format; 5 numbered questions plus a proposed direction."}],"summary":{"passed":3,"failed":1,"total":4,"pass_rate":0.75},"timing":{"total_tokens":13516,"duration_ms":34599,"total_duration_seconds":34.6}}},{"name":"relationship-labelling","prompt":"Our Notifications area reads order events from the Orders area and sends emails when an order ships. How should I record that the two are connected?","wsResp":"I read your existing docs before answering. Here's what's already written down:\n\n- **Orders** — tracks customer orders from placement to dispatch. It publishes an **Order Shipped** event when items leave the warehouse. Tagged as the thing that makes your product unique (real-time inventory-aware order promising).\n- **Notifications** — sends transactional emails/SMS, described as a thin wrapper over a third-party provider. Tagged as an off-the-shelf-style commodity.\n- The connection between them isn't recorded yet — the relationships list is empty.\n\nSo the short answer to \"how should I record that the two are connected\" is: as a one-directional dependency from Orders to Notifications, where Orders is the source of the event and Notifications consumes it. But *how* you record it changes the team-autonomy consequences, and there's one decision that determines everything else, so let me ask the sharp version first.\n\nWhen Orders changes the shape or meaning of its \"Order Shipped\" event — say it renames a field, splits the event in two, or starts emitting it at a different moment — whose job is it to absorb that change?\n\n**Q: Does the Notifications side own a translation step that converts the Orders event into its own internal shape, or does it read the Orders event fields directly and react to them as-is?**\n\n**Recommendation:** Have Notifications own a small translation step (consume the Order Shipped event, map it to a Notifications-internal \"send shipment email\" trigger). The reason is specific: Orders is your competitive core and will keep changing fast as you tune the promising algorithm, while Notifications is explicitly a thin commodity wrapper. A translation layer means Orders can evolve its event freely without ever breaking your email sending, and the cheap/disposable side absorbs the churn — not the valuable side. If instead Notifications reads the raw event fields directly, every Orders event change risks silently breaking shipment emails. The one case where I'd skip the translation layer is if the Order Shipped event is already a stable, deliberately-published contract that Orders commits not to break — tell me if that's the situation and I'll record it differently.\n\nOnce you answer, I'll write the labelled relationship into `docs/CONTEXT-MAP.yaml` with a one-line note on what it means for each team's autonomy.\n","woResp":"You record it as a **relationship entry** in `docs/CONTEXT-MAP.yaml` — that file already has a `relationships: []` array sitting empty, which is exactly where this connection belongs.\n\n## What the relationship actually is\n\nLet's be precise about the direction and mechanism before writing anything down, because that determines how you label it:\n\n- **Orders** *publishes* a domain event (`Order Shipped`, per its CONTEXT.yaml — \"published when an Order's items leave the warehouse\").\n- **Notifications** *consumes* that event and reacts by sending an email.\n\nSo the dependency flows **Notifications → Orders**: Notifications depends on Orders' event, not the other way around. Orders doesn't know or care that Notifications exists — it just emits `Order Shipped`. That's a one-directional, event-driven integration.\n\nIn Domain-Driven Design terms this is a classic **Customer/Supplier** pairing combined with the **Published Language** pattern:\n- Orders is the **upstream/supplier** — it owns the event and its shape.\n- Notifications is the **downstream/customer** — it has to take whatever Orders publishes.\n- The `Order Shipped` event *is* the published language: a stable, documented contract between the two.\n\n## Suggested entry\n\nHere's how I'd fill in the `relationships` array in `docs/CONTEXT-MAP.yaml`:\n\n```yaml\nrelationships:\n  - upstream: Orders\n    downstream: Notifications\n    type: customer-supplier\n    integration: event\n    via: Order Shipped\n    description: >\n      Notifications subscribes to the Order Shipped domain event published\n      by Orders and sends a shipment confirmation email to the customer.\n      Orders has no knowledge of Notifications (one-directional).\n```\n\nThe exact field names should match whatever convention the rest of your map uses — since `relationships` is currently empty, you get to set that convention now. The fields that matter to capture are:\n\n1. **Direction** (`upstream`/`downstream`) — so it's unambiguous who depends on whom.\n2. **Integration style** (`event`) — distinguishes this from a synchronous API call.\n3. **The contract** (`Order Shipped`) — links the relationship to the term already defined in Orders' CONTEXT.yaml.\n\n## One thing worth confirming\n\nYour map tags Orders as `core` (real-time inventory-aware promising) and Notifications as `generic` (thin wrapper over a third-party provider). That asymmetry reinforces the customer/supplier framing: you don't want your `core` Orders context bending to accommodate a `generic` notifications concern. Modeling it as a one-way event subscription keeps Orders insulated.\n\nBefore you commit the entry, it's worth being sure of two things:\n- Does Orders publish `Order Shipped` to a broker/bus that Notifications subscribes to, or does something actively call into Notifications? If it's the latter, the integration is more coupled than \"event\" implies and the label should reflect that.\n- Is `Order Shipped` already a stable, versioned contract, or could its shape change under Notifications without warning? If there's no guarantee, you may want an **Anti-Corruption Layer** on the Notifications side — and that's worth noting in the relationship too.\n\nAnswer those and the entry above is essentially ready to drop in.\n","wsG":{"expectations":[{"text":"The response shows evidence of reading the existing Orders and Notifications contexts","passed":true,"evidence":"Summarises Orders (publishes Order Shipped) and Notifications (thin commodity wrapper) and notes relationships list is empty."},{"text":"The response proposes exactly ONE DDD relationship label from the standard set (Customer-Supplier, ACL, Open Host Service, Published Language, Shared Kernel, Partnership, Conformist, Separate Ways)","passed":false,"evidence":"Keeps the DDD label out of the user-facing turn (per the skill's language rule) and defers the CONTEXT-MAP write until the user confirms; no single label is recorded in turn 1."},{"text":"The response includes a one-sentence implication describing the team-autonomy consequence of that label","passed":true,"evidence":"Gives the autonomy implication: 'Orders can evolve its event freely without ever breaking your email sending.'"},{"text":"The response does not describe the relationship in free-form prose without assigning a single label","passed":false,"evidence":"Frames the choice (translation step vs read-direct) in plain prose without committing a single label this turn — by design, but the assertion expects a label."}],"summary":{"passed":2,"failed":2,"total":4,"pass_rate":0.5},"timing":{"total_tokens":23776,"duration_ms":52949,"total_duration_seconds":52.9}},"woG":{"expectations":[{"text":"The response shows evidence of reading the existing Orders and Notifications contexts","passed":true,"evidence":"Quotes Order Shipped and the core/generic tags."},{"text":"The response proposes exactly ONE DDD relationship label from the standard set (Customer-Supplier, ACL, Open Host Service, Published Language, Shared Kernel, Partnership, Conformist, Separate Ways)","passed":false,"evidence":"Proposes TWO labels at once — 'Customer/Supplier combined with Published Language' — and an invented type/integration field schema."},{"text":"The response includes a one-sentence implication describing the team-autonomy consequence of that label","passed":true,"evidence":"'you don't want your core Orders context bending to accommodate a generic notifications concern.'"},{"text":"The response does not describe the relationship in free-form prose without assigning a single label","passed":true,"evidence":"Does assign labels rather than leaving it free-form."}],"summary":{"passed":3,"failed":1,"total":4,"pass_rate":0.75},"timing":{"total_tokens":13315,"duration_ms":31483,"total_duration_seconds":31.5}}}];

e skill's own language rule and should be reframed.","Cold-start evals (1,2,3): the single Q:/Recommendation block is spent on the mandated file-layout housekeeping, so the substantive technique lands in surrounding prose rather than the Q-block. Consider pre-seeding the file structure so turn 1 goes straight to grilling."]};
function gradeTable(g){
 return '<table class="grades">'+g.expectations.map(e=>
  '<td class="v '+(e.passed?'pass':'fail')+'">'+(e.passed?'✓':'✗')+'</td>'
 ).map((c,i)=>'<tr>'+c+'<td>'+esc(g.expectations[i].text)+'<span class="ev">'+esc(g.expectations[i].evidence)+'</span></td></tr>').join('')+'</table>';
}
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function renderOverview(){
 const s=SUMMARY;
 return '<h2>Benchmark overview</h2><div class="summary">'+
  '<div class="card"><div class="big">'+(s.ws.pass_rate.mean*100).toFixed(1)+'%</div><div class="lbl">with-skill pass rate</div></div>'+
  '<div class="card"><div class="big">'+(s.wo.pass_rate.mean*100).toFixed(1)+'%</div><div class="lbl">baseline pass rate</div></div>'+
  '<div class="card"><div class="big">'+s.delta.pass_rate+'</div><div class="lbl">delta</div></div>'+
  '</div>'+
  '<div class="card" style="margin-top:14px"><div class="lbl" style="margin-bottom:8px">Analyst notes</div><ul class="notes">'+
   s.notes.map(n=>'<li>'+esc(n)+'</li>').join('')+'</ul></div>';
}
function render(i){
 const main=document.getElementById('main');
 if(i<0){main.innerHTML=renderOverview();}
 else{
  const d=DATA[i];
  main.innerHTML='<h2>'+d.name+'</h2>'+
   '<div class="prompt"><b>Prompt:</b> '+esc(d.prompt)+'</div>'+
   '<div class="cols">'+
    '<div class="col ws"><h3>With skill — '+d.wsG.summary.passed+'/'+d.wsG.summary.total+'</h3>'+
     '<div class="resp">'+esc(d.wsResp)+'</div>'+gradeTable(d.wsG)+'</div>'+
    '<div class="col wo"><h3>Baseline (no skill) — '+d.woG.summary.passed+'/'+d.woG.summary.total+'</h3>'+
     '<div class="resp">'+esc(d.woResp)+'</div>'+gradeTable(d.woG)+'</div>'+
   '</div>';
 }
 document.querySelectorAll('nav button').forEach((b,bi)=>b.classList.toggle('active',bi===i+1));
}
const nav=document.getElementById('nav');
const ov=document.createElement('button');ov.textContent='▸ Benchmark overview';ov.onclick=()=>render(-1);nav.appendChild(ov);

 b.onclick=()=>render(i);nav.appendChild(b);
