name: Inventory
description: Tracks stock levels per warehouse and is the single source of truth for available quantity.

language:
  - term: Stock Level
    definition: The quantity of a product available at a warehouse at a point in time.
    avoid:
      - Count
      - Amount

  - term: Adjustment
    definition: A recorded change to a Stock Level, with a reason code.
    avoid:
      - Update
      - Change
