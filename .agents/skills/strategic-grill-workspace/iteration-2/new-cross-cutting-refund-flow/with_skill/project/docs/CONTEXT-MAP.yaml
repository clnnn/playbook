contexts:
  - name: Orders
    path: ./packages/orders/docs/CONTEXT.yaml
    tag: core
    description: Receives and tracks customer orders; the differentiator is real-time inventory-aware order promising.

  - name: Payments
    path: ./packages/payments/docs/CONTEXT.yaml
    tag: supporting
    description: Captures and settles payments via a third-party gateway.

  - name: Inventory
    path: ./packages/inventory/docs/CONTEXT.yaml
    tag: supporting
    description: Tracks stock levels per warehouse.

relationships:
  - upstream: Orders
    downstream: Payments
    label: Customer-Supplier
    implication: Orders sets the OrderPlaced contract; Payments adapts to it.

  - upstream: Inventory
    downstream: Orders
    label: Customer-Supplier
    implication: Inventory owns stock availability; Orders adapts to it.
