contexts:
  - name: Orders
    path: ./packages/orders/docs/CONTEXT.yaml
    tag: core
    description: Receives and tracks customer orders from placement to dispatch; the differentiator is our real-time inventory-aware order promising.

  - name: Customers
    path: ./packages/customers/docs/CONTEXT.yaml
    tag: supporting
    description: Stores customer profiles and contact details.

relationships:
  - upstream: Customers
    downstream: Orders
    label: Customer-Supplier
    implication: Customers owns the CustomerId contract; Orders adapts to it with no veto on changes.
